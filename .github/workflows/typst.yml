name: Compilar Documentación Typst
on:
  push:
    branches:
      - develop
    paths:
      - 'docs/documentacion.typ'
      - 'docs/diagramaER.dbml'

jobs:
  build_and_commit:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Convertir DBML a SVG
        run: npx @softwaretechnik/dbml-renderer -i docs/diagramaER.dbml -o docs/diagramaER.svg

      - name: Instalar Typst
        uses: typst-community/setup-typst@v3

      - name: Compilar a PDF
        run: typst compile documentacion.typ

      - name: Crear Pull Request con PDF y SVG
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "docs: actualizar diagrama ER y PDF [skip ci]"
          branch: auto/docs-update
          delete-branch: true
          title: "docs: actualizar diagrama ER y PDF"
          body: "PR automático generado tras compilar la documentación Typst y el diagrama ER."
          add-paths: |
            docs/documentacion.pdf
            docs/diagramaER.svg
