name: Compilar Documentación Typst

on:
  push:
    paths:
      - 'documentacion.typ' # despierta si cambian la documentacion
      - 'diagramaER.dbml' # despierta si cambian el diagrama

jobs:
  build_and_commit:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write 

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      # 1. PREPARAR ENTORNO PARA DBML
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 2. GENERAR EL SVG
      - name: Convertir DBML a SVG
        # Usa un renderizador de línea de comandos para crear la imagen
        run: npx @softwaretechnik/dbml-renderer diagramaER.dbml -o diagramaER.svg

      # 3. PREPARAR Y COMPILAR TYPST
      - name: Instalar Typst
        uses: typst-community/setup-typst@v3

      - name: Compilar a PDF
        run: typst compile documentacion.typ 

      # 4. GUARDAR TODO EN GITHUB
      - name: Hacer commit y push del PDF y SVG
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: actualizar diagrama ER y PDF [skip ci]"
          file_pattern: "documentacion.pdf diagramaER.svg" # Ahora guarda tanto el PDF como la imagen
